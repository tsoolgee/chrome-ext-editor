/* ===================== דיאלוגים / הודעות ===================== */
function modal({ title, body, buttons, wide }){
  if (modal._done) modal._done(null);   /* סוגר דיאלוג פתוח קודם ומנקה את המאזין שלו */
  return new Promise(res => {
    const bd = $('backdrop');
    bd.innerHTML = '';
    const d = document.createElement('div'); d.className = 'dialog' + (wide ? ' wide' : '');
    const h = document.createElement('h3'); h.textContent = title;
    const b = document.createElement('div'); b.className = 'body';
    if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
    const f = document.createElement('div'); f.className = 'foot';
    let closed = false;
    const done = v => { if (closed) return; closed = true; bd.classList.remove('open'); bd.innerHTML = ''; document.removeEventListener('keydown', onKey, true); res(v); };
    for (const btn of buttons){
      const el = document.createElement('button');
      el.className = 'btn ' + (btn.cls || ''); el.textContent = btn.label;
      el.onclick = () => { const v = typeof btn.value === 'function' ? btn.value() : btn.value; if (v !== undefined) done(v); };
      f.appendChild(el);
    }
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); done(null); } };
    document.addEventListener('keydown', onKey, true);
    bd.onmousedown = e => { if (e.target === bd) done(null); };
    d.append(h, b, f); bd.appendChild(d); bd.classList.add('open');
    const first = b.querySelector('input,select,textarea,.choice') || f.querySelector('button');
    if (first) setTimeout(() => first.focus(), 30);
    modal._done = done;
  });
}
function confirmDlg(title, html, danger){
  return modal({ title, body:`<div>${html}</div>`, buttons:[
    { label:danger ? 'מחק' : 'אישור', cls:danger ? 'btn-danger' : 'btn-primary', value:true },
    { label:'ביטול', value:false }] }).then(v => v === true);
}
function promptDlg(title, label, def, validate){
  const w = document.createElement('div');
  w.innerHTML = `<label>${esc(label)}</label>`;
  const inp = document.createElement('input'); inp.type = 'text'; inp.value = def || '';
  const err = document.createElement('div'); err.className = 'err';
  w.append(inp, err);
  const check = () => { const e = validate ? validate(inp.value) : null; err.textContent = e || ''; return !e; };
  inp.oninput = check;
  inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); if (check()) modal._done(inp.value); } };
  setTimeout(() => { const d = (def || '').lastIndexOf('.'); inp.focus(); inp.setSelectionRange(0, d > 0 ? d : (def || '').length); }, 40);
  return modal({ title, body:w, buttons:[
    { label:'אישור', cls:'btn-primary', value:() => check() ? inp.value : undefined },
    { label:'ביטול', value:null }] });
}
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'toast ' + (kind || '');
  t.innerHTML = msg; $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 3200);
}

/* ===================== בדיקת תקינות ===================== */
let vTimer = null;
const scheduleValidate = () => { clearTimeout(vTimer);
  vTimer = setTimeout(() => { try { validate(); } catch(e){ console.error('validate:', e); } }, 400); };
function lineOf(text, pos){ return text.slice(0, pos).split('\n').length; }

function validate(){
  const E = [], W = [];
  const mf = P.files.get('manifest.json');
  let man = null;
  if (!mf) E.push({ msg:'חסר הקובץ manifest.json — בלעדיו כרום לא יטען את התוסף.' });
  else if (mf.binary) E.push({ file:'manifest.json', msg:'manifest.json אינו קובץ טקסט.' });
  else if (!mf.text.trim())
    E.push({ file:'manifest.json', line:1, msg:'manifest.json ריק — צריך למלא אותו כדי שכרום יטען את התוסף.' });
  else {
    try { man = JSON.parse(mf.text); }
    catch(e){
      const m = /position (\d+)/.exec(e.message);
      const ln = m ? lineOf(mf.text, +m[1]) : 1;
      E.push({ file:'manifest.json', line:ln, msg:'manifest.json אינו JSON תקין — ' + esc(e.message) });
    }
  }
  if (man && typeof man === 'object'){
    const at = key => { if (!mf) return 1;
      const i = mf.text.indexOf('"' + key + '"'); return i < 0 ? 1 : lineOf(mf.text, i); };
    if (man.manifest_version === undefined) E.push({ file:'manifest.json', line:1, msg:'חסר השדה manifest_version (צריך להיות 3).' });
    else if (man.manifest_version !== 3) W.push({ file:'manifest.json', line:at('manifest_version'), msg:'manifest_version הוא ' + man.manifest_version + '. כרום החדש עובד עם 3.' });
    if (!man.name) E.push({ file:'manifest.json', line:1, msg:'חסר שם התוסף (השדה name).' });
    if (!man.version) E.push({ file:'manifest.json', line:1, msg:'חסרה גרסה (השדה version).' });
    else if (!/^\d+(\.\d+){0,3}$/.test(String(man.version)))
      E.push({ file:'manifest.json', line:at('version'), msg:'version חייב להיות עד 4 מספרים מופרדים בנקודה — לדוגמה 1.0.3' });

    const arr = v => Array.isArray(v) ? v : [];
    const referenced = new Set();
    const need = (p, where) => {
      if (typeof p !== 'string' || !p || /^(https?:)?\/\//.test(p)) return;
      const clean = p.replace(/^\.?\//, '');
      referenced.add(clean);
      if (!P.files.has(clean.split(/[?#]/)[0])) E.push({ file:'manifest.json', line:at(where),
        msg:`ה-manifest מפנה ל-"${esc(clean)}" אבל הקובץ לא קיים בפרויקט.` });
    };
    need(man.action?.default_popup, 'default_popup');
    need(man.background?.service_worker, 'service_worker');
    need(man.options_page, 'options_page');
    need(man.options_ui?.page, 'options_ui');
    for (const k of Object.keys(man.icons || {})) need(man.icons[k], 'icons');
    for (const k of Object.keys(man.action?.default_icon || {})) need(man.action.default_icon[k], 'default_icon');
    for (const cs of arr(man.content_scripts)){
      arr(cs && cs.js).forEach(p => need(p, 'content_scripts'));
      arr(cs && cs.css).forEach(p => need(p, 'content_scripts'));
      if (arr(cs && cs.matches).includes('<all_urls>'))
        W.push({ file:'manifest.json', line:at('matches'), msg:'content_scripts מוגדר על &lt;all_urls&gt; — הקוד ירוץ בכל אתר שגולשים בו. מומלץ לצמצם ל-matches ספציפי.' });
      if (!arr(cs && cs.matches).length)
        E.push({ file:'manifest.json', line:at('content_scripts'), msg:'ל-content_scripts חייב להיות matches עם לפחות ערך אחד.' });
    }
    for (const w of arr(man.web_accessible_resources))
      arr(w && w.resources).forEach(p => { if (typeof p === 'string' && !p.includes('*')) need(p, 'web_accessible_resources'); });

    /* התאמת מידות אייקונים */
    for (const [k, v] of Object.entries(man.icons || {})){
      const f = P.files.get(String(v).replace(/^\.?\//, ''));
      if (f && f.w && f.w !== +k)
        W.push({ file:f.path, msg:`האייקון מוגדר תחת "${esc(k)}" אבל המידות שלו הן ${f.w}×${f.h}.` });
    }
    /* קבצים יתומים */
    for (const p of P.files.keys()){
      if (p === 'manifest.json' || referenced.has(p)) continue;
      if (man.default_locale && p.startsWith('_locales/')) continue;
      const textBlob = [...P.files.values()].filter(f => !f.binary && f.path !== p).map(f => f.text).join('\n');
      if (textBlob.includes(base(p))) continue;
      W.push({ file:p, msg:'אף קובץ לא מפנה אל ' + esc(base(p)) + ' — ייתכן שהוא מיותר.' });
    }
  }
  /* JSON תקין בכל שאר קבצי ה-JSON */
  for (const f of P.files.values()){
    if (f.binary || f.path === 'manifest.json' || ext(f.path) !== 'json' || !f.text.trim()) continue;
    try { JSON.parse(f.text); }
    catch(e){ const m = /position (\d+)/.exec(e.message);
      E.push({ file:f.path, line:m ? lineOf(f.text, +m[1]) : 1, msg:'JSON לא תקין — ' + esc(e.message) }); }
  }
  lastProblems = { errors:E, warnings:W };
  renderProblems();
  return E.length === 0;
}
function renderProblems(){
  const { errors:E, warnings:W } = lastProblems;
  $('st-prob').textContent = `${E.length} שגיאות · ${W.length} אזהרות`;
  const be = $('badge-err'), bw = $('badge-warn');
  be.hidden = !E.length; be.textContent = E.length;
  bw.hidden = !W.length; bw.textContent = W.length;
  const list = $('p-list'); list.innerHTML = '';
  if (!E.length && !W.length){ list.innerHTML = '<div class="prob-ok">✓ הכל תקין. התוסף מוכן לייצוא ולטעינה בכרום.</div>'; return; }
  for (const it of [...E.map(x => ({ ...x, t:'err' })), ...W.map(x => ({ ...x, t:'warn' }))]){
    const d = document.createElement('div'); d.className = 'prob ' + it.t;
    d.innerHTML = `<span class="k">${it.t === 'err' ? '✖' : '⚠'}</span><span class="msg">${it.msg}</span>` +
                  (it.file ? `<span class="loc">${esc(it.file)}${it.line ? ':' + it.line : ''}</span>` : '');
    if (it.file) d.onclick = () => { openFile(it.file, true); if (it.line) gotoLine(it.line); };
    list.appendChild(d);
  }
}
function gotoLine(n){
  const f = P.files.get(active); if (!f || f.binary) return;
  const lines = ta.value.split('\n');
  let pos = 0; for (let i = 0; i < Math.min(n-1, lines.length); i++) pos += lines[i].length + 1;
  ta.focus(); ta.selectionStart = ta.selectionEnd = pos;
  const lh = 21; ta.scrollTop = Math.max(0, (n-4) * lh); syncScroll(); updatePos();
}
$('btn-check').onclick = $('st-prob').onclick = () => { validate(); $('problems').classList.toggle('open'); };
$('p-close').onclick = () => $('problems').classList.remove('open');

/* ===================== ייבוא / ייצוא ZIP ===================== */
async function importZipFile(file){
  try {
    setSaveState('טוען ZIP…');
    const entries = await zipRead(await file.arrayBuffer());
    /* Compress-Archive של וינדוס כותב נתיבים עם בקסלאש — בלי זה כל תיקיות המשנה נזרקות */
    for (const e of entries) e.name = e.name.replace(/\\/g, '/');
    let names = entries.map(e => e.name).filter(n => !JUNK.some(r => r.test(n)));
    if (!names.length) throw new Error('לא נמצא בקובץ שום דבר לטעון.');

    /* הסרת תיקיית שורש עוטפת יחידה */
    const tops = new Set(names.map(n => n.split('/')[0]));
    let strip = '';
    if (tops.size === 1 && names.some(n => n.includes('/'))){
      const top = [...tops][0];
      if (!names.includes(top)) strip = top + '/';
    }
    const ok = await confirmDlg('ייבוא ZIP',
      `לטעון את <b>${esc(file.name)}</b> לעריכה?<br><span class="hint">הפרויקט הנוכחי יוחלף. אפשר לשמור אותו קודם בעזרת "הורדת ZIP".</span>`);
    if (!ok){ setSaveState('בוטל'); return; }
    if (P.id && !await saveBeforeLeaving('ייבוא ה-ZIP')) return;

    const nf = new Map(), nfold = new Set();
    let loaded = 0, skipped = [];
    for (const e of entries){
      if (JUNK.some(r => r.test(e.name))) continue;
      let n = e.name;
      if (strip && n.startsWith(strip)) n = n.slice(strip.length);
      if (!n) continue;
      if (e.folder || n.endsWith('/')){ const c = n.replace(/\/$/, ''); if (c) nfold.add(c); continue; }
      if (n.split('/').some(part => !part || partInvalid(part))){ skipped.push(n); continue; }
      const isTxt = looksText(n, e.data);
      nf.set(n, { text:isTxt ? decodeText(e.data) : null, bytes:isTxt ? null : e.data, binary:!isTxt });
      loaded++;
    }
    if (!loaded && !nfold.size) throw new Error('לא נמצאו קבצים בתוך ה-ZIP.');

    undoCache.delete(P.id);      /* אותו מזהה, תוכן אחר לגמרי — ההיסטוריה כבר לא רלוונטית */
    P.files.forEach(dropUrl);
    P.files.clear(); P.folders.clear(); collapsed.clear(); tabs = []; active = null; previewTab = null;
    nfold.forEach(d => P.folders.add(d));
    for (const [p, v] of nf) addFile(p, v.binary ? v.bytes : v.text);
      P.name = file.name.replace(/\.[^.]*$/, '') || 'My Extension';
    if (!P.id) P.id = newId();
    nameGuard = true; $('ext-name').value = P.name; nameGuard = false;
    syncNameFromManifest(true);
    if (P.files.has('manifest.json')) openFile('manifest.json', true);
    else { const first = [...P.files.keys()].find(p => !P.files.get(p).binary); if (first) openFile(first, true); }
    renderTree(); renderTabs(); showActive(); validate(); persist();
    toast(`נטענו ${loaded} קבצים${strip ? ' · הוסרה תיקיית השורש "' + strip.slice(0,-1) + '"' : ''}${skipped.length ? ' · דולגו ' + skipped.length : ''}`, 'ok');
  } catch(e){
    setSaveState('מוכן');
    modal({ title:'הייבוא נכשל', body:`<div>${esc(e.message)}</div><div class="hint" style="margin-top:10px">הפרויקט הקיים נשאר כמו שהיה.</div>`,
            buttons:[{ label:'סגירה', cls:'btn-primary', value:true }] });
  }
}
function safeName(s){ return (s || '').replace(/[\\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60) || 'extension'; }
async function exportZip(){
  if (!P.files.size) return toast('אין מה לייצא — הפרויקט ריק.', 'warn');
  try { validate(); } catch(e){ console.error('validate:', e); }   /* בדיקה שנכשלת לא תמנע ייצוא */
  if (lastProblems.errors.length){
    $('problems').classList.add('open');
    const go = await confirmDlg('נמצאו שגיאות',
      `יש ${lastProblems.errors.length} שגיאות שעלולות למנוע מכרום לטעון את התוסף.<br><span class="hint">אפשר לייצא בכל זאת.</span>`);
    if (!go) return;
  }
  setSaveState('אורז ZIP…');
  const enc = new TextEncoder(), entries = [];
  const dirsWithFiles = new Set();
  for (const p of P.files.keys()){ let d = dir(p); while (d){ dirsWithFiles.add(d); d = dir(d); } }
  for (const d of [...P.folders].sort()) if (!dirsWithFiles.has(d)) entries.push({ name:d + '/', folder:true });
  for (const p of [...P.files.keys()].sort()){
    const f = P.files.get(p);
    entries.push({ name:p, data:f.binary ? f.bytes : enc.encode(f.text) });   /* UTF-8 ללא BOM */
  }
  try {
    const blob = await zipWrite(entries);
    saveBlob(blob, safeName(P.name) + '.zip');
    P.files.forEach(f => f.dirty = false);
    renderTree(); renderTabs();
    toast(`יוצא <b class="num">${esc(safeName(P.name))}.zip</b> · ${entries.length} רשומות · <span class="num">${fmtSize(blob.size)}</span>`, 'ok');
    setSaveState('נשמר ל-IndexedDB'); persist();
  } catch(e){
    setSaveState('מוכן');
    modal({ title:'הייצוא נכשל', body:`<div>${esc(e.message)}</div>
      <div class="hint" style="margin-top:10px">אם ההורדה נחסמת (סינון רשת), אפשר להוריד כל קובץ בנפרד דרך תפריט ⋯ שליד הקובץ.</div>`,
      buttons:[{ label:'סגירה', cls:'btn-primary', value:true }] });
  }
}

/* ===================== שם התוסף ↔ manifest ===================== */
let nameGuard = false;
function syncNameFromManifest(silent){
  const f = P.files.get('manifest.json'); if (!f || f.binary) return;
  try { const m = JSON.parse(f.text);
    if (m && typeof m.name === 'string' && m.name !== P.name){ P.name = m.name; nameGuard = true; $('ext-name').value = m.name; nameGuard = false; }
  } catch(e){ if (!silent) {} }
}
$('ext-name').addEventListener('input', () => {
  if (nameGuard) return;
  P.name = $('ext-name').value;
  const f = P.files.get('manifest.json'); if (!f || f.binary) return scheduleSave();
  try {
    const m = JSON.parse(f.text);
    m.name = P.name;
    const next = JSON.stringify(m, null, 2);
    f.text = next; f.lastText = next; f.dirty = true;
    if (active === 'manifest.json'){ const s = ta.selectionStart; ta.value = next; ta.selectionStart = ta.selectionEnd = Math.min(s, next.length); paint(); }
    renderTree(); renderTabs(); scheduleValidate();
  } catch(e){ /* manifest לא תקין — לא נוגעים בו */ }
  scheduleSave();
});

/* ===================== חיפוש והחלפה ===================== */
let hits = [], hitIdx = -1;
function runFind(){
  const q = $('f-find').value, f = P.files.get(active);
  hits = []; hitIdx = -1;
  if (q && f && !f.binary){
    const t = ta.value.toLowerCase(), qq = q.toLowerCase();
    let i = t.indexOf(qq);
    while (i >= 0){ hits.push(i); i = t.indexOf(qq, i + Math.max(1, qq.length)); }
  }
  $('f-count').textContent = hits.length ? `1 / ${hits.length}` : '0 / 0';
  if (hits.length){ hitIdx = 0; focusHit(); }
}
function focusHit(){
  const q = $('f-find').value;
  if (!hits.length) return;
  hitIdx = (hitIdx + hits.length) % hits.length;
  const p = hits[hitIdx];
  ta.focus(); ta.setSelectionRange(p, p + q.length);
  const line = ta.value.slice(0, p).split('\n').length;
  ta.scrollTop = Math.max(0, (line - 6) * 21); syncScroll(); updatePos();
  $('f-count').textContent = `${hitIdx+1} / ${hits.length}`;
}
function openFind(withReplace){
  const f = P.files.get(active); if (!f || f.binary) return toast('החיפוש עובד רק בקבצי טקסט.', 'warn');
  $('findbar').classList.add('open');
  $('f-rep-line').style.display = withReplace ? 'flex' : 'none';
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  if (sel && !sel.includes('\n')) $('f-find').value = sel;
  $('f-find').focus(); $('f-find').select(); runFind();
}
$('f-find').addEventListener('input', runFind);
$('f-find').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); hitIdx += e.shiftKey ? -1 : 1; focusHit(); }
  if (e.key === 'Escape'){ e.preventDefault(); closeFind(); }
});
$('f-next').onclick = () => { hitIdx++; focusHit(); };
$('f-prev').onclick = () => { hitIdx--; focusHit(); };
$('f-close').onclick = closeFind;
function closeFind(){ $('findbar').classList.remove('open'); ta.focus(); }
$('f-rep1').onclick = () => {
  const f = active && P.files.get(active), q = $('f-find').value;
  if (!f || f.binary || !q || hitIdx < 0 || !hits.length) return;
  const pos = hits[hitIdx];
  /* אם העורך השתנה מאז החיפוש, ההיסט כבר לא מצביע על מה שחיפשנו — מחפשים מחדש במקום להרוס טקסט */
  if (pos === undefined || ta.value.substr(pos, q.length).toLowerCase() !== q.toLowerCase()){ runFind(); return; }
  pushUndo(f, true);
  ta.setRangeText($('f-replace').value, pos, pos + q.length, 'end');
  ta.dispatchEvent(new Event('input')); runFind();
};
$('f-repall').onclick = () => {
  const q = $('f-find').value;
  const f = active && P.files.get(active);
  if (!q || !f || f.binary) return;
  runFind();                                   /* מסתמכים על ההיסטים העדכניים, ובאותה רגישות רישיות כמו החיפוש */
  if (!hits.length) return toast('לא נמצאו מופעים', 'warn');
  pushUndo(f, true);
  const rep = $('f-replace').value, n = hits.length;
  let v = ta.value;
  for (let i = n - 1; i >= 0; i--) v = v.slice(0, hits[i]) + rep + v.slice(hits[i] + q.length);
  ta.value = v;
  ta.dispatchEvent(new Event('input')); runFind();
  toast(`הוחלפו ${n} מופעים`, 'ok');
};

/* ===================== העתקת הפרויקט כטקסט ===================== */
function projectAsText(){
  const paths = [...P.files.keys()].sort();
  const emptyDirs = [...P.folders].sort().filter(d => !paths.some(p => p.startsWith(d + '/')));
  const out = [`# ${P.name}`, '', 'מבנה הפרויקט:'];
  for (const d of emptyDirs) out.push('  ' + d + '/');
  for (const p of paths) out.push('  ' + p);
  out.push('');
  for (const p of paths){
    const f = P.files.get(p);
    if (f.binary){ out.push(`--- ${p} — קובץ בינארי (${fmtSize(fileSize(f))}), לא נכלל ---`, ''); continue; }
    /* גדר ארוכה מכל רצף גרשים הפוכים בקובץ עצמו, אחרת קובץ עם ``` שובר את המבנה */
    const longest = Math.max(0, ...(f.text.match(/`+/g) || []).map(r => r.length));
    const fence = '`'.repeat(Math.max(3, longest + 1));
    out.push(`--- ${p} ---`, fence + (langOf(p) || ''), f.text, fence, '');
  }
  return out.join('\n');
}
async function copyProjectText(){
  if (!P.files.size) return toast('אין מה להעתיק — הפרויקט ריק.', 'warn');
  const txt = projectAsText();
  const size = fmtSize(new TextEncoder().encode(txt).length);
  try {
    await navigator.clipboard.writeText(txt);
    toast(`הפרויקט הועתק ללוח — ${P.files.size} קבצים, <span class="num">${size}</span>`, 'ok');
    return;
  } catch(e){ /* נופלים להעתקה ידנית */ }
  const w = document.createElement('div');
  w.innerHTML = '<div class="hint">הדפדפן חסם העתקה אוטומטית. הטקסט מסומן — העתיקו עם <kbd>Ctrl</kbd>+<kbd>C</kbd>:</div>';
  const t = document.createElement('textarea');
  t.value = txt; t.rows = 15; t.readOnly = true; t.style.direction = 'ltr'; t.style.textAlign = 'left';
  w.appendChild(t);
  setTimeout(() => { t.focus(); t.select(); }, 60);
  modal({ title:'העתקת הפרויקט כטקסט', body:w, wide:true,
          buttons:[{ label:'סגירה', cls:'btn-primary', value:true }] });
}

      Ctrl+F חיפוש · Ctrl+H החלפה · Ctrl+P חיפוש קובץ · Ctrl+W סגירת לשונית<br>
      Ctrl+B סרגל צד · Ctrl+Z / Ctrl+Y ביטול וחזרה · F2 שינוי שם · Del מחיקה
    </div>
    <div class="credit-box">
      רעיון מקורי: <b>מיני האקר</b> — <a href="https://mitmachim.top/post/1239410" target="_blank" rel="noopener">mitmachim.top/post/1239410</a><br>
      פיתוח ויצירה: <b>צול גאה</b> — <a href="https://TSOOLGEE.UK" target="_blank" rel="noopener">TSOOLGEE.UK</a>
    </div>`,
    buttons:[{ label:'סגירה', cls:'btn-primary', value:true }] });
}

/* ===================== פרויקטים ===================== */
/* פרויקט ריק — אותו מבנה קבצים, בלי תוכן */
function loadEmpty(){
  P.files.clear(); P.folders.clear(); P.name = 'My Extension';
  for (const k of Object.keys(DEFAULTS)) addFile(k, '', { dirty:true });
  P.folders.add('icons');
  tabs = []; active = null; previewTab = null; collapsed.clear();
}
const FILE_LIST = Object.keys(DEFAULTS).join(' · ') + ' · icons/';

async function newProject(){
  const w = document.createElement('div');
  w.innerHTML = `
    <button class="choice" data-k="full">
      <b>🧩 תבנית מלאה</b>
      <div>manifest תקין וקוד התחלתי בכל קובץ, כולל שלושה אייקונים מוכנים.
      אפשר לייצא ולטעון בכרום מיד, ואז לשנות.</div>
      <div class="files">${esc(FILE_LIST)}icon16.png · icon48.png · icon128.png</div>
    </button>
    <button class="choice" data-k="empty">
      <b>📄 פרויקט ריק</b>
      <div>אותם קבצים בדיוק ואותה תיקיית <code>icons</code> — אבל כולם ריקים לגמרי.
      מתאים למי שבונה מאפס או מדביק קוד מבינה מלאכותית.</div>
      <div class="files">${esc(FILE_LIST)}</div>
    </button>`;
  w.querySelectorAll('.choice').forEach(el => el.onclick = () => modal._done(el.dataset.k));
  const kind = await modal({ title:'פרויקט חדש', body:w, buttons:[{ label:'ביטול', value:null }] });
  if (!kind) return;
  await createProject(kind);
}
async function createProject(kind){
  if (P.id && !await saveBeforeLeaving('יצירת פרויקט חדש')) return;
  stashUndo();
  P.files.forEach(dropUrl);
  P.id = newId();
  if (kind === 'full') loadDefaults(); else loadEmpty();
  refreshAll();
  if (P.files.has('manifest.json')) openFile('manifest.json', true);
  await persist();
  toast(kind === 'full' ? 'נוצר פרויקט חדש מתבנית מלאה' : 'נוצר פרויקט ריק — הקבצים נוצרו ריקים', 'ok');
}

const relTime = t => { const s = (Date.now() - t) / 1000;
  if (s < 60) return 'עכשיו';
  if (s < 3600) return 'לפני ' + Math.floor(s/60) + ' דק׳';
  if (s < 86400) return 'לפני ' + Math.floor(s/3600) + ' שע׳';
  if (s < 604800) return 'לפני ' + Math.floor(s/86400) + ' ימים';
  return new Date(t).toLocaleDateString('he-IL'); };

async function projectsDialog(){
  clearTimeout(saveTimer); await persist();   /* כישלון כאן כבר מדווח ע"י persist */
  const w = document.createElement('div');
  const draw = async () => {
    const idx = (await listProjects()).sort((a, b) => b.updated - a.updated);
    w.innerHTML = '';
    const list = document.createElement('div'); list.className = 'plist';
    for (const p of idx){
      const cur = p.id === P.id;
      const r = document.createElement('div'); r.className = 'prow' + (cur ? ' cur' : '');
      r.innerHTML = `<span class="mark">${cur ? '●' : ''}</span>
        <span class="pn">${esc(p.name || 'ללא שם')}</span>
        <span class="pm">${p.count} קבצים · ${relTime(p.updated)}</span>
        <span class="pa">
          <button class="icon-btn" data-a="ren" title="שינוי שם">✎</button>
          <button class="icon-btn" data-a="dup" title="שכפול">⧉</button>
          <button class="icon-btn" data-a="del" title="מחיקה">🗑</button>
        </span>`;
      r.querySelector('.pn').onclick = r.querySelector('.pm').onclick = async () => {
        if (!cur){ modal._done(null); await switchProject(p.id); }
      };
      r.querySelector('[data-a=ren]').onclick = async () => {
        const nm = await promptDlg('שינוי שם הפרויקט', 'שם חדש:', p.name, v => v.trim() ? null : 'צריך להזין שם.');
        if (nm === null) return;
        await renameProject(p.id, nm.trim()); projectsDialog();
      };
      r.querySelector('[data-a=dup]').onclick = async () => { await duplicateProject(p.id); projectsDialog(); };
      r.querySelector('[data-a=del]').onclick = async () => {
        const ok = await confirmDlg('מחיקת פרויקט',
          `למחוק את <b>${esc(p.name)}</b> (${p.count} קבצים)?<br><span class="hint">אי אפשר לבטל. אפשר לשמור אותו קודם בעזרת "הורדת ZIP".</span>`, true);
        if (!ok) return projectsDialog();
        await deleteProject(p.id); projectsDialog();
      };
      list.appendChild(r);
    }
    if (!idx.length) list.innerHTML = '<div class="hint" style="padding:14px;text-align:center">אין פרויקטים שמורים.</div>';
    w.appendChild(list);
  };
  await draw();
  const v = await modal({ title:'הפרויקטים שלי', body:w,
    buttons:[{ label:'＋ פרויקט חדש', cls:'btn-primary', value:'new' }, { label:'סגירה', value:null }] });
  if (v === 'new') await newProject();
}
async function renameProject(id, name){
  const rec = id === P.id ? snapshot() : await idbGet('p:' + id);
  if (!rec) return;
  rec.name = name;
  const mf = (rec.files || []).find(f => f.path === 'manifest.json' && !f.binary);
  if (mf){ try { const m = JSON.parse(mf.text); m.name = name; mf.text = JSON.stringify(m, null, 2);
                 const c = undoCache.get(id); if (c) c.delete('manifest.json'); } catch(e){} }
  await idbSet('p:' + id, rec);
  const idx = await listProjects(); const e = idx.find(x => x.id === id);
  if (e) e.name = name;
  await idbSet('projects', idx);
  if (id === P.id){ applyRecord(rec); refreshAll(); }
  toast('שם הפרויקט שונה ל-<b>' + esc(name) + '</b>', 'ok');
}
async function duplicateProject(id){
  const rec = id === P.id ? snapshot() : await idbGet('p:' + id);
  if (!rec) return;
  const copy = { ...rec, id:newId(), name:rec.name + ' — עותק', updated:Date.now() };
  await idbSet('p:' + copy.id, copy);
  const idx = await listProjects();
  idx.push({ id:copy.id, name:copy.name, updated:copy.updated, count:(copy.files || []).length });
  await idbSet('projects', idx);
  toast('שוכפל: <b>' + esc(copy.name) + '</b>', 'ok');
}
async function deleteProject(id){
  await idbDel('p:' + id);
  let idx = (await listProjects()).filter(x => x.id !== id);
  await idbSet('projects', idx);
  if (id !== P.id){ toast('הפרויקט נמחק', 'ok'); return; }
  if (idx.length){
    const rec = await idbGet('p:' + idx.sort((a, b) => b.updated - a.updated)[0].id);
    if (rec){ applyRecord(rec); undoCache.delete(id); refreshAll(); prefs.set('last', P.id);
              toast('הפרויקט נמחק — עברת אל <b>' + esc(P.name) + '</b>', 'ok'); return; }
  }
  P.files.forEach(dropUrl); P.id = newId(); loadDefaults(); undoCache.delete(id); refreshAll();
  openFile('manifest.json', true); await persist();
  toast('הפרויקט נמחק — נוצר פרויקט חדש', 'ok');
}

/* ===================== חיבורי ממשק ===================== */
$('btn-new').onclick = newProject;
$('btn-projects').onclick = projectsDialog;
$('btn-open').onclick = () => $('zip-input').click();
$('btn-export').onclick = exportZip;
$('btn-help').onclick = showHelp;
$('t-newfile').onclick = () => newFile(currentFolder());
$('t-newfolder').onclick = () => newFolder(currentFolder());
$('t-upload').onclick = () => pickUpload(currentFolder());
$('t-copytext').onclick = copyProjectText;
$('t-collapse').onclick = () => { P.folders.forEach(f => collapsed.add(f)); renderTree(); scheduleSave(); };
function currentFolder(){ return active ? dir(active) : ''; }
function pickUpload(folder){
  const inp = $('file-input'); inp.value = '';
  inp.onchange = () => { if (inp.files.length) uploadFiles(inp.files, folder); };
  inp.click();
}
$('zip-input').onchange = e => { const f = e.target.files[0]; if (f) importZipFile(f); e.target.value = ''; };

/* ערכת נושא */
const htmlEl = document.documentElement;
function setTheme(t){ htmlEl.setAttribute('data-theme', t); $('theme-toggle').textContent = t === 'dark' ? '🌙' : '☀️'; prefs.set('theme', t); }
$('theme-toggle').onclick = () => setTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* גלישת שורות */
function setWrap(on){ document.body.classList.toggle('wrap-on', on); ta.wrap = on ? 'soft' : 'off';
  $('st-wrap').textContent = 'Wrap: ' + (on ? 'on' : 'off'); prefs.set('wrap', on); syncScroll(); }
$('st-wrap').onclick = () => setWrap(!document.body.classList.contains('wrap-on'));

/* סרגל צד — שינוי רוחב */
(() => {
  const r = $('resizer'), sb = $('sidebar');
  let dragging = false;
  r.onmousedown = e => { dragging = true; r.classList.add('on'); e.preventDefault(); document.body.style.cursor = 'col-resize'; };
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.min(520, Math.max(150, innerWidth - e.clientX));
    sb.style.width = w + 'px'; prefs.set('sbw', w);
  });
  document.addEventListener('mouseup', () => { if (!dragging) return; dragging = false; r.classList.remove('on'); document.body.style.cursor = ''; });
})();

/* גרירת קבצים מהמערכת */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  if (++dragDepth === 1 && !e.target.closest('.file-tree')) $('dropzone').classList.add('on');
});
window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('dropzone').classList.remove('on'); } });
window.addEventListener('drop', async e => {
  dragDepth = 0; $('dropzone').classList.remove('on');
  if (!e.dataTransfer.files.length) return;
  if (e.target.closest('.tree-item[data-dir="1"]')) return;   /* טופל בשורת העץ */
  e.preventDefault();
  await uploadFiles(e.dataTransfer.files, '');
});

/* הדבקת תמונה מהלוח */
document.addEventListener('paste', async e => {
  if (document.activeElement === ta || e.target.matches('input,textarea')) return;
  const items = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith('image/'));
  if (!items.length) return;
  e.preventDefault();
  const blob = items[0].getAsFile(); if (!blob) return;
  const folder = currentFolder();
  const p = uniquePath(join(folder, 'image-' + Date.now() + '.' + (blob.type.split('/')[1] || 'png')));
  addFile(p, new Uint8Array(await blob.arrayBuffer()), { dirty:true });
  renderTree(); openFile(p, true); toast('התמונה הודבקה כ-' + base(p), 'ok'); scheduleSave();
});

/* קיצורי מקלדת גלובליים */
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  const inDialog = $('backdrop').classList.contains('open') || $('qo').classList.contains('open');
  const k = e.key.toLowerCase();
  if (ctrl && k === 's' && !e.shiftKey){ e.preventDefault(); saveActive(); return; }
  if (ctrl && k === 's' && e.shiftKey){ e.preventDefault(); exportZip(); return; }
  if (ctrl && k === 'o'){ e.preventDefault(); $('zip-input').click(); return; }
  if (inDialog) return;
  if (ctrl && k === 'n'){ e.preventDefault(); newFile(currentFolder()); return; }
  if (ctrl && k === 'p'){ e.preventDefault(); openQO(); return; }
  if (ctrl && k === 'f'){ e.preventDefault(); openFind(false); return; }
  if (ctrl && k === 'h'){ e.preventDefault(); openFind(true); return; }
  if (ctrl && k === 'b'){ e.preventDefault(); document.body.classList.toggle('sb-collapsed'); prefs.set('sbc', document.body.classList.contains('sb-collapsed')); return; }
  if (ctrl && k === 'w'){ e.preventDefault(); if (active) closeTab(active); return; }
  if (ctrl && e.key === 'Tab'){ e.preventDefault(); if (tabs.length > 1){ const i = tabs.indexOf(active); openFile(tabs[(i+1) % tabs.length], true); } return; }
  if (e.key === 'Escape'){ if ($('findbar').classList.contains('open')) closeFind(); hideCtx(); return; }
  if (document.activeElement === ta || e.target.matches('input,textarea,select')) return;
  if (e.key === 'F2' && active){ e.preventDefault(); startRename(active, false); return; }
  if (e.key === 'Delete' && active){ e.preventDefault(); deleteNode(active, false); return; }
});
function saveActive(){
  const f = active && P.files.get(active);
  if (!f){ persist(); return toast('נשמר', 'ok'); }
  if (!f.binary) f.text = ta.value;
  f.dirty = false; renderTree(); renderTabs(); validate(); persist();
  toast('נשמר: ' + base(f.path), 'ok');
}
/* מזהירים רק כשבאמת יש מה לאבד: שמירה תלויה או שמירה שנכשלה.
   סימון "נערך" בעץ מציין "טרם יוצא ל-ZIP" ולא "לא נשמר", ולכן הוא לא תנאי כאן. */
window.addEventListener('beforeunload', e => {
  if (savePending || saveBroken){ e.preventDefault(); e.returnValue = ''; }
});
window.addEventListener('resize', syncScroll);

/* ===================== אתחול ===================== */
(async function init(){
  setTheme(prefs.get('theme', 'dark'));
  setWrap(prefs.get('wrap', false));
  const w = prefs.get('sbw', 260); $('sidebar').style.width = w + 'px';
  if (prefs.get('sbc', false)) document.body.classList.add('sb-collapsed');

  let restored = false;
  try {
    /* הגירה מהגרסה הישנה בעלת פרויקט יחיד */
    let idx = await listProjects();
    const old = await idbGet('project');
    if (!idx.length && old && old.files && old.files.length){
      const rec = { ...old, id:newId(), updated:Date.now(), v:2 };
      await idbSet('p:' + rec.id, rec);
      await idbSet('projects', [{ id:rec.id, name:rec.name, updated:rec.updated, count:rec.files.length }]);
      await idbDel('project');
      idx = await listProjects();
    }
    if (idx.length){
      const want = prefs.get('last', null);
      const pick = idx.find(x => x.id === want) || idx.sort((a, b) => b.updated - a.updated)[0];
      const rec = await idbGet('p:' + pick.id);
      if (rec){ applyRecord(rec); restored = true; }
    }
  } catch(e){ restored = false; }
  if (!restored){ P.id = newId(); loadDefaults(); tabs = ['manifest.json']; active = 'manifest.json'; }
  nameGuard = true; $('ext-name').value = P.name; nameGuard = false;
  syncNameFromManifest(true);
  renderTree(); renderTabs(); showActive(); validate();
  if (!restored) persist();
  setSaveState(restored ? 'שוחזר מ-IndexedDB' : 'מוכן');
  if (restored) toast('הפרויקט <b>' + esc(P.name) + '</b> שוחזר מהדפדפן', 'ok');
  if (typeof CompressionStream === 'undefined')
    toast('הדפדפן לא תומך בדחיסה — קובץ ה-ZIP ייווצר ללא דחיסה (עדיין תקין לחלוטין).', 'warn');
})();
</script>
